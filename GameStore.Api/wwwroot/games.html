<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все игры — GameStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/site.css?v=5">
</head>
<body>
    <header class="container" id="site-header"></header>
    <main class="container">
        <h1>Все игры</h1>
        <p class="page-sizes" id="page-sizes">
            <a href="#" data-size="10">10</a>
            <a href="#" data-size="25">25</a>
            <a href="#" data-size="50">50</a>
        </p>
        <div class="pager" data-pager></div>
        <p id="status">Загрузка…</p>
        <div id="games" class="game-list" data-layout="list"></div>
        <div class="pager" data-pager></div>
    </main>
    <script src="/js/site.js?v=5"></script>
    <script src="/js/layout.js?v=5"></script>
    <script>
        mountHeader("games");

        const allowedSizes = new Set([10, 25, 50]);
        const params = new URLSearchParams(window.location.search);
        let page = Number(params.get("page")) || 1;
        let pageSize = Number(params.get("pageSize")) || 10;

        if (page < 1) {
            page = 1;
        }

        if (!allowedSizes.has(pageSize)) {
            pageSize = 10;
        }

        const status = document.getElementById("status");
        const root = document.getElementById("games");

        function goTo(nextPage, nextSize) {
            const query = new URLSearchParams();
            query.set("page", String(nextPage));
            query.set("pageSize", String(nextSize));
            window.location.search = query.toString();
        }

        function fillPagers(gameCount) {
            for (const pager of document.querySelectorAll("[data-pager]")) {
                pager.replaceChildren();

                const prev = document.createElement("button");
                prev.type = "button";
                prev.textContent = "Назад";
                prev.disabled = page <= 1;
                prev.addEventListener("click", () => goTo(page - 1, pageSize));

                const label = document.createElement("p");
                label.textContent = "Страница " + page;

                const next = document.createElement("button");
                next.type = "button";
                next.textContent = "Вперёд";
                next.disabled = gameCount < pageSize;
                next.addEventListener("click", () => goTo(page + 1, pageSize));

                pager.append(prev, label, next);
            }
        }

        for (const link of document.querySelectorAll("#page-sizes a")) {
            const size = Number(link.getAttribute("data-size"));
            if (size === pageSize) {
                link.setAttribute("aria-current", "page");
            }

            link.addEventListener("click", (event) => {
                event.preventDefault();
                goTo(1, size);
            });
        }

        (async function () {
            try {
                const games = await fetchGames({ page, pageSize });

                if (games.length === 0) {
                    status.textContent = page === 1
                        ? "Каталог пуст."
                        : "На этой странице игр нет.";
                } else {
                    status.textContent = "";
                    renderGames(root, games, "list");
                }

                fillPagers(games.length);
            } catch (error) {
                status.textContent = error.message;
                fillPagers(0);
            }
        })();
    </script>
</body>
</html>
