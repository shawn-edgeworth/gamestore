<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все игры — GameStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/site.css?v=8">
</head>
<body>
    <header class="container" id="site-header"></header>
    <main class="container">
        <h1>Все игры</h1>
        <p class="page-sizes" id="page-sizes">
            <a href="#" data-size="10">10</a>
            <a href="#" data-size="25">25</a>
            <a href="#" data-size="50">50</a>
        </p>
        <div class="pager" data-pager></div>
        <p id="status">Загрузка…</p>
        <div id="games" class="game-list" data-layout="list"></div>
        <div class="pager" data-pager></div>
    </main>
    <script src="/js/site.js?v=8"></script>
    <script src="/js/layout.js?v=8"></script>
    <script>
        mountHeader("games");

        const allowedSizes = new Set([10, 25, 50]);
        const params = new URLSearchParams(window.location.search);
        let page = Number(params.get("page")) || 1;
        let pageSize = Number(params.get("pageSize")) || 10;

        if (page < 1) {
            page = 1;
        }

        if (!allowedSizes.has(pageSize)) {
            pageSize = 10;
        }

        const status = document.getElementById("status");
        const root = document.getElementById("games");

        function goTo(nextPage, nextSize) {
            const query = new URLSearchParams();
            query.set("page", String(nextPage));
            query.set("pageSize", String(nextSize));
            window.location.search = query.toString();
        }

        function showPage(allGames) {
            const paged = paginateList(allGames, page, pageSize);
            if (paged.page !== page) {
                goTo(paged.page, pageSize);
                return;
            }

            if (paged.total === 0) {
                status.textContent = "Каталог пуст.";
            } else {
                status.textContent = "";
                renderGames(root, paged.items, "list");
            }

            fillPagers(paged.page, paged.pageCount, (nextPage) => goTo(nextPage, pageSize));
        }

        for (const link of document.querySelectorAll("#page-sizes a")) {
            const size = Number(link.getAttribute("data-size"));
            if (size === pageSize) {
                link.setAttribute("aria-current", "page");
            }

            link.addEventListener("click", (event) => {
                event.preventDefault();
                goTo(1, size);
            });
        }

        (async function () {
            try {
                const games = await fetchGames({});
                showPage(games);
            } catch (error) {
                status.textContent = error.message;
                fillPagers(page, 1, () => {});
            }
        })();
    </script>
</body>
</html>
