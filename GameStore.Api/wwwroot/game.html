<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра — GameStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/site.css?v=5">
</head>
<body>
    <header class="container" id="site-header"></header>
    <main class="container">
        <p id="status">Загрузка…</p>
        <article id="detail" class="game-detail" hidden></article>
    </main>
    <script src="/js/site.js?v=5"></script>
    <script src="/js/layout.js?v=5"></script>
    <script>
        mountHeader("games");

        const params = new URLSearchParams(window.location.search);
        const id = Number(params.get("id"));
        const status = document.getElementById("status");
        const detail = document.getElementById("detail");
        const cartHost = document.createElement("div");
        cartHost.className = "game-qty";

        async function renderCartControls(gameId) {
            cartHost.replaceChildren();

            if (!isLoggedIn()) {
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = "В корзину";
                button.addEventListener("click", () => {
                    window.location.href = "/login.html?next="
                        + encodeURIComponent("/game.html?id=" + gameId);
                });
                cartHost.append(button);
                return;
            }

            const cart = await fetchCart();
            if (!cart) {
                redirectToLogin();
                return;
            }

            const item = (cart.cartItems ?? []).find((row) => row.gameId === gameId);

            if (!item) {
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = "В корзину";
                button.addEventListener("click", async () => {
                    const response = await addCartItem(gameId, 1);
                    if (response.status === 401) {
                        redirectToLogin();
                        return;
                    }

                    if (!response.ok) {
                        status.textContent = await readApiError(response);
                        return;
                    }

                    status.textContent = "";
                    await renderCartControls(gameId);
                    await mountHeader("games");
                });
                cartHost.append(button);
                return;
            }

            const stepper = createQtyStepper(item.quantity, {
                onDelta: (delta) => changeQuantity(gameId, item.quantity + delta),
                onSet: (value) => changeQuantity(gameId, value)
            });
            cartHost.append(stepper);
        }

        async function changeQuantity(gameId, quantity) {
            let response;
            if (!Number.isInteger(quantity) || quantity < 1) {
                response = await deleteCartItem(gameId);
            } else {
                response = await setCartItemQuantity(gameId, quantity);
            }

            if (response.status === 401) {
                redirectToLogin();
                return;
            }

            if (!response.ok) {
                status.textContent = await readApiError(response);
                await renderCartControls(gameId);
                return;
            }

            status.textContent = "";
            await renderCartControls(gameId);
            await mountHeader("games");
        }

        (async function () {
            if (!id) {
                status.textContent = "Не указан id игры.";
                return;
            }

            try {
                const response = await fetch("/games/" + id);
                if (response.status === 404) {
                    status.textContent = "Игра не найдена.";
                    return;
                }

                if (!response.ok) {
                    status.textContent = await readApiError(response);
                    return;
                }

                const game = await response.json();
                document.title = game.name + " — GameStore";
                status.textContent = "";
                detail.hidden = false;
                detail.replaceChildren();

                const title = document.createElement("h1");
                title.textContent = game.name;

                const meta = document.createElement("p");
                const category = game.categoryName ?? "Без категории";
                meta.textContent = category + " · " + formatMoney(game.price);

                const description = document.createElement("p");
                description.textContent = game.description ?? "";

                detail.append(
                    createGameImage(game.imageUrl, game.name),
                    title,
                    meta,
                    description,
                    cartHost
                );

                await renderCartControls(game.id);
            } catch (error) {
                status.textContent = error.message;
            }
        })();
    </script>
</body>
</html>
