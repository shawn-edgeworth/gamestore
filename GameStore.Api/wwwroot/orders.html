<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы — GameStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/site.css?v=5">
</head>
<body>
    <header class="container" id="site-header"></header>
    <main class="container">
        <h1>Мои заказы</h1>
        <p id="status">Загрузка…</p>
        <div id="orders"></div>
    </main>
    <script src="/js/site.js?v=5"></script>
    <script src="/js/layout.js?v=5"></script>
    <script>
        mountHeader("orders");

        if (requireLogin()) {
            const status = document.getElementById("status");
            const root = document.getElementById("orders");
            const paidStatus = 0;
            const refundedStatus = 1;

            async function refundOrder(orderId, button) {
                status.textContent = "";
                button.disabled = true;

                const response = await fetch("/orders/" + orderId + "/refund", {
                    method: "POST",
                    headers: authHeaders()
                });

                if (response.status === 401) {
                    redirectToLogin();
                    return;
                }

                if (!response.ok) {
                    status.textContent = await readApiError(response);
                    button.disabled = false;
                    await loadOrders();
                    return;
                }

                await loadOrders();
                await renderNav("orders");
            }

            async function loadOrders() {
                status.textContent = "Загрузка…";
                root.replaceChildren();

                const response = await fetch("/orders", { headers: authHeaders() });
                if (response.status === 401) {
                    redirectToLogin();
                    return;
                }

                if (!response.ok) {
                    status.textContent = await readApiError(response);
                    return;
                }

                const data = await response.json();
                const orders = data.orders ?? [];

                if (orders.length === 0) {
                    status.textContent = "Заказов пока нет.";
                    return;
                }

                status.textContent = "";

                for (const order of orders) {
                    const article = document.createElement("article");
                    const heading = document.createElement("h2");
                    const when = order.createdAt
                        ? new Date(order.createdAt).toLocaleString("ru-RU")
                        : "";
                    heading.textContent = when || "Заказ";

                    const list = document.createElement("ul");
                    let total = 0;
                    for (const item of order.items ?? []) {
                        const line = document.createElement("li");
                        const lineSum = Number(item.unitPrice) * Number(item.quantity);
                        total += lineSum;
                        line.textContent =
                            item.gameName + " × " + item.quantity + " · " + formatMoney(item.unitPrice);
                        list.append(line);
                    }

                    const sum = document.createElement("p");
                    sum.textContent = "Итого: " + formatMoney(total);

                    article.append(heading, list, sum);

                    if (order.orderStatus === paidStatus) {
                        const refund = document.createElement("button");
                        refund.type = "button";
                        refund.textContent = "Вернуть заказ";
                        refund.addEventListener("click", () => refundOrder(order.id, refund));
                        article.append(refund);
                    } else if (order.orderStatus === refundedStatus) {
                        const note = document.createElement("p");
                        note.textContent = "Возвращён";
                        article.append(note);
                    }

                    root.append(article);
                }
            }

            loadOrders().catch((error) => {
                status.textContent = error.message;
            });
        }
    </script>
</body>
</html>
