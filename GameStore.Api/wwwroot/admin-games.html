<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игры — редактирование</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/site.css?v=5">
</head>
<body>
    <header class="container" id="site-header"></header>
    <main class="container">
        <h1>Игры</h1>
        <p id="admin-status"></p>
        <form id="game-form">
            <input type="hidden" name="gameId">
            <div class="grid">
                <label>
                    Название
                    <input name="name" required>
                </label>
                <label>
                    Цена ($)
                    <input name="price" type="number" min="0" step="0.01" required>
                </label>
                <label>
                    Категория
                    <select name="categoryId" required></select>
                </label>
            </div>
            <label>
                Описание
                <textarea name="description" rows="2"></textarea>
            </label>
            <div class="grid">
                <label>
                    Дата выхода
                    <input name="releaseDate" type="date">
                </label>
                <label>
                    Ссылка на изображение
                    <input name="imageUrl" type="url" placeholder="https://...">
                </label>
            </div>
            <div class="grid">
                <button type="submit">Сохранить игру</button>
                <button type="button" id="game-reset" class="secondary">Новая игра</button>
            </div>
        </form>
        <div class="overflow-auto">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th></th>
                        <th>Название</th>
                        <th>Цена</th>
                        <th>Категория</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="games-body"></tbody>
            </table>
        </div>
    </main>
    <script src="/js/site.js?v=5"></script>
    <script src="/js/layout.js?v=5"></script>
    <script>
        mountHeader("admin-games");
    </script>
    <script src="/js/admin.js?v=5"></script>
</body>
</html>
